# Theme only. The server host/port are set by the launcher locally and by the
# host (e.g. Streamlit Community Cloud) in production - don't pin server.address
# here or a cloud deploy becomes unreachable.
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0a0e16"
secondaryBackgroundColor = "#111827"
textColor = "#e5e7eb"
font = "sans serif"

[browser]
gatherUsageStats = false
