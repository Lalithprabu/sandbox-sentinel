[project]
name = "sandbox-sentinel"
version = "0.1.0"
description = "Zero-cost firewall and tamper-evident flight recorder for AI agent tool calls."
requires-python = ">=3.10"
authors = [{ name = "LalithPrabu" }]
readme = "README.md"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
demo = ["streamlit>=1.45"]
dev = ["pytest>=8", "pytest-html>=4", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/Lalithprabu/sandbox-sentinel"
Issues = "https://github.com/Lalithprabu/sandbox-sentinel/issues"
Author = "https://github.com/Lalithprabu"

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: talks to a real local Ollama model (skipped if unavailable)"]
