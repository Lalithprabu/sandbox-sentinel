name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact input. For a verdict, include the action (kind / target / payload) with secrets removed.
      placeholder: |
        python -m sentinel shell "..."
        # got ALLOW, expected BLOCK
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -m sentinel --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python
      placeholder: Windows 11 · Python 3.11
    validations:
      required: true
